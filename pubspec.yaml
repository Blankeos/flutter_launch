name: flutter_launch
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  build_verify: ^3.1.0
  flutter:
    sdk: flutter
  flutter_platform_widgets: ^9.0.0
  go_router: ^15.1.3
  go_router_builder: ^3.0.0
  provider: ^6.1.5
  smooth_page_indicator: ^1.2.1
  shared_preferences: ^2.5.3
  dart_mappable: ^4.6.1
  flutter_dotenv: ^6.0.0
  command_it: ^9.0.2
  dio: ^5.9.0
  dio_cookie_manager: ^3.3.0
  cookie_jar: ^4.0.8
  path_provider: ^2.1.5
  flutter_svg: ^2.2.2
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.7
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.7.1
  dart_mappable_builder: ^4.6.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - .env
